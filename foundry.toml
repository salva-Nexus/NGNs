[profile.default]
src = "src"
out = "out"
libs = ["lib"]

remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]


[fmt]
line_length = 110              
tab_width = 4  
bracket_spacing = true         

multiline_func_header = "attributes_first" 

# 4. Clean-up Logic
sort_imports = true            # Alphabetizes imports automatically
wrap_comments = true           # Wraps long NatSpec to your line_length 